name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # NEXT_PUBLIC_* values are inlined at build time. These are placeholders
      # so the build is representative; real values come from the deploy.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /railway-proxy
          NEXT_PUBLIC_SITE_URL: https://khi.krd
          NEXT_PUBLIC_SITE_LABEL: KHI
